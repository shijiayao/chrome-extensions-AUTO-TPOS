<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPOS</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="container-main">
        <!-- 不提供操作按钮 -->
        <div class="tabs-div default-box">
            <div class="image-box">
                <img src="../static/windmill.png" alt="">
            </div>
        </div>

        <div class="tabs-div auto-fully">
            <div class="button-box">
                <button id="mock-exam">模拟考试</button>
            </div>
            <div class="button-box">
                <button id="start-auto-fully">一键开始（学习 Or 考试）</button>
            </div>
        </div>

        <!-- 违法数据统计 -->
        <div class="tabs-div violation-statistics">
            <div class="violation-statistics-box">
                <button class="violation-statistics-button" id="violation-statistics-button-customize">违法数据统计（自定义）</button>
            </div>
        </div>
    </div>

    <script src="./index.js"></script>
</body>

</html>
